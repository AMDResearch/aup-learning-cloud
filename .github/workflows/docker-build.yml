name: Build Docker Images

on:
  push:
    branches: [main, develop]
    tags: ['v*']
    paths:
      - 'dockerfiles/**'
      - 'runtime/hub/**'
      - 'runtime/notebook/**'
      - 'runtime/shared/**'
      - 'runtime/code-server/**'
      - 'projects/**'
      - '.github/workflows/docker-build.yml'
      - '.github/build-config.json'
  pull_request:
    branches: [main, develop, feature/course-migration]
    paths:
      - 'dockerfiles/**'
      - 'runtime/hub/**'
      - 'runtime/notebook/**'
      - 'runtime/shared/**'
      - 'runtime/code-server/**'
      - 'projects/**'
      - '.github/workflows/docker-build.yml'
      - '.github/build-config.json'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for images (e.g. v1.2.0)'
        required: false
        default: ''
      images:
        description: 'Which images to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - hub
          - code
          - code-cpu
          - code-gpu
          - courses
          - base-cpu
          - base-gpu
      gpu_target:
        description: 'GPU target (all = build every target)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - gfx110x
          - gfx1150
          - gfx1151
          - gfx1152
          - gfx120x

# Build matrix is defined in .github/build-config.json

# Prevent duplicate builds on the same branch / PR
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # ──────────────────────────────────────────────
  # Detect which files changed to decide what to build
  # ──────────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      hub: ${{ steps.filter.outputs.hub }}
      code: ${{ steps.filter.outputs.code }}
      courses: ${{ steps.filter.outputs.courses }}
      base-cpu: ${{ steps.filter.outputs.base-cpu }}
      base-gpu: ${{ steps.filter.outputs.base-gpu }}
      registry: ${{ steps.registry.outputs.prefix }}
      is-tag: ${{ steps.check.outputs.is-tag }}
      gpu-targets: ${{ steps.config.outputs.targets }}
      gpu-map: ${{ steps.config.outputs.gpu-map }}
      default-gpu-target: ${{ steps.config.outputs.default }}
      course-list: ${{ steps.courses.outputs.list }}
      course-gpu-targets: ${{ steps.courses.outputs.targets }}
      course-default-gpu-target: ${{ steps.courses.outputs.default }}
      image-name-suffix: ${{ steps.names.outputs.suffix }}
      hub-image: ${{ steps.names.outputs.hub }}
      code-cpu-image: ${{ steps.names.outputs.code-cpu }}
      code-gpu-image: ${{ steps.names.outputs.code-gpu }}
      base-cpu-image: ${{ steps.names.outputs.base-cpu }}
      base-gpu-image: ${{ steps.names.outputs.base-gpu }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set registry prefix
        id: registry
        run: echo "prefix=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Resolve image names
        id: names
        env:
          # Repo-level variable. Leave unset in upstream (public) repo → "" → names
          # stay as auplc-base / auplc-cv / … Set to e.g. "-dev" in a fork so every
          # published image (and the BASE_IMAGE consumed by course builds) flips to
          # auplc-base-dev / auplc-cv-dev / …  Keeps forks from colliding with
          # upstream packages and lets dev branches self-reference their own base.
          SUFFIX: ${{ vars.IMAGE_NAME_SUFFIX }}
          REGISTRY: ${{ steps.registry.outputs.prefix }}
        run: |
          echo "suffix=${SUFFIX}"        >> "$GITHUB_OUTPUT"
          echo "hub=${REGISTRY}/auplc-hub${SUFFIX}"         >> "$GITHUB_OUTPUT"
          echo "code-cpu=${REGISTRY}/auplc-code-cpu${SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "code-gpu=${REGISTRY}/auplc-code-gpu${SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "base-cpu=${REGISTRY}/auplc-default${SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "base-gpu=${REGISTRY}/auplc-base${SUFFIX}"    >> "$GITHUB_OUTPUT"

      - name: Check if tag push
        id: check
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "is-tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Load build config
        id: config
        run: |
          CONFIG='.github/build-config.json'
          ALL_NAMES=$(jq -c '[.gpu_targets[].name]' "$CONFIG")
          DEFAULT=$(jq -r '.default_gpu_target' "$CONFIG")
          GPU_MAP=$(jq -c '.gpu_targets' "$CONFIG")

          INPUT="${{ github.event.inputs.gpu_target }}"
          if [[ -n "$INPUT" && "$INPUT" != "all" ]]; then
            echo "targets=[\"${INPUT}\"]" >> "$GITHUB_OUTPUT"
          else
            echo "targets=${ALL_NAMES}" >> "$GITHUB_OUTPUT"
          fi
          echo "default=${DEFAULT}" >> "$GITHUB_OUTPUT"
          echo "gpu-map=${GPU_MAP}" >> "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@v3
        if: github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
        id: filter
        with:
          filters: |
            hub:
              - 'dockerfiles/Hub/**'
              - 'runtime/hub/**'
            code:
              - 'dockerfiles/Code/**'
              - 'runtime/code-server/**'
              - 'runtime/shared/**'
            courses:
              - 'projects/aup-teaching-labs'
              - 'projects/course-base-version.txt'
              - '.github/workflows/docker-build.yml'
            course-submodule:
              - 'projects/aup-teaching-labs'
            course-base:
              - 'projects/course-base-version.txt'
            course-workflow:
              - '.github/workflows/docker-build.yml'
            base-cpu:
              - 'dockerfiles/Base/Dockerfile.cpu'
              - 'runtime/notebook/**'
              - 'runtime/shared/**'
              - 'runtime/package.json'
              - 'runtime/.npmrc'
              - 'runtime/pnpm-lock.yaml'
              - 'runtime/pnpm-workspace.yaml'
              - 'runtime/hub/frontend/tsconfig.base.json'
            base-gpu:
              - 'dockerfiles/Base/Dockerfile.rocm'
              - 'runtime/notebook/**'
              - 'runtime/shared/**'
              - 'runtime/package.json'
              - 'runtime/.npmrc'
              - 'runtime/pnpm-lock.yaml'
              - 'runtime/pnpm-workspace.yaml'
              - 'runtime/hub/frontend/tsconfig.base.json'
              - '.github/build-config.json'

      # Course list, contexts and targets come from the teaching-labs submodule.
      # A submodule bump rebuilds only courses whose context changed between the
      # old and new submodule commits; changing projects/course-base-version.txt
      # rebuilds every course without a base-version.override.txt; manual runs,
      # tags and workflow edits select all.
      - name: Select course builds
        id: courses
        env:
          TL_PATH: projects/aup-teaching-labs
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          SUBMODULE_CHANGED: ${{ steps.filter.outputs.course-submodule }}
          BASE_CHANGED: ${{ steps.filter.outputs.course-base }}
          WORKFLOW_CHANGED: ${{ steps.filter.outputs.course-workflow }}
          OLD_REV: ${{ github.event.pull_request.base.sha || github.event.before }}
          GPU_INPUT: ${{ github.event.inputs.gpu_target }}
        run: |
          CONFIG="$TL_PATH/.github/build-config.json"
          if [[ ! -f "$CONFIG" ]] || ! jq -e '.courses[0] | type == "object"' "$CONFIG" > /dev/null; then
            echo "::warning file=$TL_PATH::Submodule has no course build config; skipping course images"
            { echo "list=[]"; echo "targets=[]"; echo "default="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=null
          if [[ "$EVENT_NAME" == workflow_dispatch || "$REF_TYPE" == tag || "$WORKFLOW_CHANGED" == true ]]; then
            :
          elif [[ "$SUBMODULE_CHANGED" != true ]]; then
            CHANGED='[]'
          else
            OLD=""
            if [[ -n "$OLD_REV" && ! "$OLD_REV" =~ ^0+$ ]] && git fetch -q --depth=1 origin "$OLD_REV"; then
              OLD=$(git ls-tree "$OLD_REV" "$TL_PATH" | awk '$2 == "commit" { print $3 }')
            fi
            if [[ -n "$OLD" ]] && git -C "$TL_PATH" fetch -q --depth=1 origin "$OLD"; then
              CHANGED=$(git -C "$TL_PATH" diff --no-renames --name-only "$OLD" HEAD | jq -Rsc 'split("\n") | map(select(. != ""))')
            else
              echo "::notice::Previous submodule commit unavailable; building all courses"
            fi
          fi

          OVERRIDDEN=$(jq -r '.courses[].context | rtrimstr("/")' "$CONFIG" | while read -r c; do
            if [[ -f "$TL_PATH/$c/base-version.override.txt" ]]; then echo "$c"; fi
          done | jq -Rsc 'split("\n") | map(select(. != ""))')

          LIST=$(jq -c --arg p "$TL_PATH/" --argjson changed "$CHANGED" \
            --argjson overridden "$OVERRIDDEN" --arg base_changed "$BASE_CHANGED" '
            [.courses[]
              | (.context | rtrimstr("/")) as $c
              | select($changed == null or any($changed[]; startswith($c + "/"))
                  or ($base_changed == "true" and ($overridden | index($c) | not)))
              | .context = $p + $c]' "$CONFIG")
          TARGETS=$(jq -c --arg t "$GPU_INPUT" '[.gpu_targets[].name | select($t == "" or $t == "all" or . == $t)]' "$CONFIG")
          {
            echo "list=${LIST}"
            echo "targets=${TARGETS}"
            echo "default=$(jq -r '.default_gpu_target' "$CONFIG")"
          } >> "$GITHUB_OUTPUT"
          echo "Course builds: \`${LIST}\`" >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────
  # Hub Image (CPU only, runs on GitHub Actions)
  # ──────────────────────────────────────────────
  build-hub:
    name: Build Hub Image
    needs: changes
    if: |
      needs.changes.outputs.is-tag == 'true' ||
      (github.event_name != 'workflow_dispatch' && needs.changes.outputs.hub == 'true') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.images == 'all' || github.event.inputs.images == 'hub'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.changes.outputs.hub-image }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.event.inputs.version }},enable=${{ github.event.inputs.version != '' }}
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr

      - name: Build and push Hub image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfiles/Hub/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=hub
          cache-to: type=gha,mode=max,scope=hub
          provenance: false

  # ──────────────────────────────────────────────
  # Code CPU Image (code-server environment)
  # ──────────────────────────────────────────────
  build-code-cpu:
    name: Build Code CPU Image
    needs: [changes, build-base-cpu]
    if: |
      always() &&
      needs.changes.result == 'success' &&
      (needs.build-base-cpu.result == 'success' || needs.build-base-cpu.result == 'skipped') &&
      (
        needs.changes.outputs.is-tag == 'true' ||
        (github.event_name != 'workflow_dispatch' && (needs.changes.outputs.code == 'true' || needs.changes.outputs.base-cpu == 'true')) ||
        (
          github.event_name == 'workflow_dispatch' &&
          (
            github.event.inputs.images == 'all' ||
            github.event.inputs.images == 'code' ||
            github.event.inputs.images == 'code-cpu' ||
            github.event.inputs.images == 'base-cpu'
          )
        )
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: runtime/pnpm-lock.yaml

      - name: Package Hub link extension
        working-directory: runtime
        run: |
          pnpm install --frozen-lockfile --filter auplc-hub-link...
          rm -f code-server/extensions/auplc-hub-link/auplc-hub-link-*.vsix
          HUB_LINK_VERSION=$(node -p "require('./code-server/extensions/auplc-hub-link/package.json').version")
          pnpm --filter @auplc/runtime-status run build
          pnpm --filter auplc-hub-link run build
          test -f "code-server/extensions/auplc-hub-link/auplc-hub-link-${HUB_LINK_VERSION}.vsix"

      - name: Clean Hub link build artifacts
        if: always()
        run: |
          rm -rf runtime/code-server/extensions/auplc-hub-link/node_modules
          rm -rf runtime/code-server/extensions/auplc-hub-link/out
          rm -f runtime/code-server/extensions/auplc-hub-link/auplc-hub-link-*.vsix

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.changes.outputs.code-cpu-image }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.event.inputs.version }},enable=${{ github.event.inputs.version != '' }}
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr

      - name: Build and push Code CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfiles/Code/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ needs.changes.outputs.base-cpu-image }}:latest
            IMAGE_FLAVOR=cpu
          cache-from: type=gha,scope=code-cpu
          cache-to: type=gha,mode=max,scope=code-cpu
          provenance: false

  # ──────────────────────────────────────────────
  # Base CPU Image (runs on GitHub Actions)
  # ──────────────────────────────────────────────
  build-base-cpu:
    name: Build Base CPU Image
    needs: changes
    if: |
      needs.changes.outputs.is-tag == 'true' ||
      (github.event_name != 'workflow_dispatch' && needs.changes.outputs.base-cpu == 'true') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.images == 'all' || github.event.inputs.images == 'base-cpu'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.changes.outputs.base-cpu-image }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr

      - name: Build and push Base CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfiles/Base/Dockerfile.cpu
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=base-cpu
          cache-to: type=gha,mode=max,scope=base-cpu
          provenance: false

  # ──────────────────────────────────────────────
  # Code GPU Image (code-server environment)
  # ──────────────────────────────────────────────
  build-code-gpu:
    name: "Build Code GPU Image (${{ matrix.gpu_target }})"
    needs: [changes, build-base-gpu]
    if: |
      always() &&
      needs.changes.result == 'success' &&
      (needs.build-base-gpu.result == 'success' || needs.build-base-gpu.result == 'skipped') &&
      (
        needs.changes.outputs.is-tag == 'true' ||
        (github.event_name != 'workflow_dispatch' && (needs.changes.outputs.code == 'true' || needs.changes.outputs.base-gpu == 'true')) ||
        (
          github.event_name == 'workflow_dispatch' &&
          (
            github.event.inputs.images == 'all' ||
            github.event.inputs.images == 'code' ||
            github.event.inputs.images == 'code-gpu' ||
            github.event.inputs.images == 'base-gpu'
          )
        )
      )
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gpu_target: ${{ fromJSON(needs.changes.outputs.gpu-targets) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: runtime/pnpm-lock.yaml

      - name: Package Hub link extension
        working-directory: runtime
        run: |
          pnpm install --frozen-lockfile --filter auplc-hub-link...
          rm -f code-server/extensions/auplc-hub-link/auplc-hub-link-*.vsix
          HUB_LINK_VERSION=$(node -p "require('./code-server/extensions/auplc-hub-link/package.json').version")
          pnpm --filter @auplc/runtime-status run build
          pnpm --filter auplc-hub-link run build
          test -f "code-server/extensions/auplc-hub-link/auplc-hub-link-${HUB_LINK_VERSION}.vsix"

      - name: Clean Hub link build artifacts
        if: always()
        run: |
          rm -rf runtime/code-server/extensions/auplc-hub-link/node_modules
          rm -rf runtime/code-server/extensions/auplc-hub-link/out
          rm -f runtime/code-server/extensions/auplc-hub-link/auplc-hub-link-*.vsix

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (target-suffixed tags)
        id: meta-suffixed
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.changes.outputs.code-gpu-image }}
          flavor: |
            suffix=-${{ matrix.gpu_target }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.event.inputs.version }},enable=${{ github.event.inputs.version != '' }}
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr

      - name: Docker metadata (unsuffixed tags — default target only)
        if: matrix.gpu_target == needs.changes.outputs.default-gpu-target
        id: meta-default
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.changes.outputs.code-gpu-image }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.event.inputs.version }},enable=${{ github.event.inputs.version != '' }}
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr

      - name: Merge tags
        id: tags
        run: |
          TAGS="${{ steps.meta-suffixed.outputs.tags }}"
          if [ -n "${{ steps.meta-default.outputs.tags }}" ]; then
            TAGS="${TAGS}
          ${{ steps.meta-default.outputs.tags }}"
          fi
          TAGS=$(echo "$TAGS" | sort -u)
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Code GPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfiles/Code/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.meta-suffixed.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ needs.changes.outputs.base-gpu-image }}:latest-${{ matrix.gpu_target }}
            IMAGE_FLAVOR=gpu
          cache-from: type=gha,scope=code-gpu-${{ matrix.gpu_target }}
          cache-to: type=gha,mode=max,scope=code-gpu-${{ matrix.gpu_target }}
          provenance: false

  # ──────────────────────────────────────────────
  # Base GPU Image (multi-target via GPU_TARGET)
  #
  # No GPU hardware required — only installs ROCm apt packages + pip wheels.
  # Uses free-disk-space action to reclaim runner disk for the large image.
  # Builds GPU targets in parallel via matrix strategy.
  # ──────────────────────────────────────────────
  build-base-gpu:
    name: "Build Base GPU Image (${{ matrix.gpu_target }})"
    needs: changes
    if: |
      needs.changes.outputs.is-tag == 'true' ||
      (github.event_name != 'workflow_dispatch' && needs.changes.outputs.base-gpu == 'true') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.images == 'all' || github.event.inputs.images == 'base-gpu'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gpu_target: ${{ fromJSON(needs.changes.outputs.gpu-targets) }}
    outputs:
      image: ${{ steps.out.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve GPU config
        id: suffix
        run: |
          echo "tag_suffix=${{ matrix.gpu_target }}" >> "$GITHUB_OUTPUT"
          # Look up target-specific build metadata; fall back to gpu_target if not found
          WHL=$(echo '${{ needs.changes.outputs.gpu-map }}' | jq -r --arg t "${{ matrix.gpu_target }}" '.[] | select(.name == $t) | .pytorch_whl // .name')
          SDK=$(echo '${{ needs.changes.outputs.gpu-map }}' | jq -r --arg t "${{ matrix.gpu_target }}" '.[] | select(.name == $t) | .rocm_sdk // .name')
          echo "pytorch_whl=${WHL}" >> "$GITHUB_OUTPUT"
          echo "rocm_sdk=${SDK}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata (target-suffixed tags)
        id: meta-suffixed
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.changes.outputs.base-gpu-image }}
          flavor: |
            suffix=-${{ steps.suffix.outputs.tag_suffix }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.event.inputs.version }},enable=${{ github.event.inputs.version != '' }}
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr

      - name: Docker metadata (unsuffixed tags — default target only)
        if: matrix.gpu_target == needs.changes.outputs.default-gpu-target
        id: meta-default
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.changes.outputs.base-gpu-image }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.event.inputs.version }},enable=${{ github.event.inputs.version != '' }}
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr

      - name: Merge tags
        id: tags
        run: |
          TAGS="${{ steps.meta-suffixed.outputs.tags }}"
          if [ -n "${{ steps.meta-default.outputs.tags }}" ]; then
            TAGS="${TAGS}
          ${{ steps.meta-default.outputs.tags }}"
          fi
          # Deduplicate
          TAGS=$(echo "$TAGS" | sort -u)
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Base GPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfiles/Base/Dockerfile.rocm
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.meta-suffixed.outputs.labels }}
          build-args: |
            GPU_TARGET=${{ matrix.gpu_target }}
            ROCM_SDK_TARGET=${{ steps.suffix.outputs.rocm_sdk }}
            PYTORCH_WHL_TARGET=${{ steps.suffix.outputs.pytorch_whl }}
          cache-from: type=gha,scope=base-gpu-${{ matrix.gpu_target }}
          cache-to: type=gha,mode=max,scope=base-gpu-${{ matrix.gpu_target }}
          provenance: false

      - name: Export first image tag for downstream jobs
        if: github.event_name != 'pull_request'
        id: out
        run: echo "image=$(echo '${{ steps.tags.outputs.tags }}' | head -1)" >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────
  # Course Images (from the aup-teaching-labs submodule)
  #
  # projects/course-base-version.txt selects one released base for every course;
  # a course may hold another release in <context>/base-version.override.txt.
  # Courses build on that release's auplc-base digest — never on the base built
  # in this run.
  # PRs build without pushing; other branches publish dev tags.
  # main and release tags promote tested digests instead (promote-courses).
  # ──────────────────────────────────────────────
  build-courses:
    name: "Build Course: ${{ matrix.course.name }} (${{ matrix.gpu_target }})"
    needs: changes
    if: |
      needs.changes.outputs.course-list != '[]' &&
      github.ref != 'refs/heads/main' && github.ref_type != 'tag' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.images == 'all' || github.event.inputs.images == 'courses')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        course: ${{ fromJSON(needs.changes.outputs.course-list) }}
        gpu_target: ${{ fromJSON(needs.changes.outputs.course-gpu-targets) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Free disk space
        if: matrix.course.disk_cleanup == true
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve base image
        id: base
        env:
          COURSE_DIR: ${{ matrix.course.context }}
          GPU_TARGET: ${{ matrix.gpu_target }}
        run: |
          VERSION_FILE=projects/course-base-version.txt
          if [[ -f "$COURSE_DIR/base-version.override.txt" ]]; then
            VERSION_FILE="$COURSE_DIR/base-version.override.txt"
            echo "::warning file=$VERSION_FILE::Course overrides the base selected in projects/course-base-version.txt"
          fi
          if [[ -f "$COURSE_DIR/base-version.txt" ]]; then
            echo "::warning file=$COURSE_DIR/base-version.txt::Ignored; LC selects the base in projects/course-base-version.txt"
          fi
          version=$(sed -e 's/#.*//' -e 's/[[:space:]]//g' "$VERSION_FILE" | grep -v '^$' || true)
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error file=$VERSION_FILE::Set one released AUP Learning Cloud version (vX.Y.Z)"
            exit 1
          fi
          if [[ "$GPU_TARGET" == cpu ]]; then
            ref="ghcr.io/amdresearch/auplc-default:$version"
          else
            ref="ghcr.io/amdresearch/auplc-base:$version-$GPU_TARGET"
          fi
          # Build on the digest so a re-pushed tag cannot change the base mid-run.
          if ! digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -er .digest); then
            echo "::error file=$VERSION_FILE::Base image $ref is not published"
            exit 1
          fi
          echo "image=$ref@$digest" >> "$GITHUB_OUTPUT"
          echo "Base image: \`$ref@$digest\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (target-suffixed tags)
        id: meta-suffixed
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.changes.outputs.registry }}/${{ matrix.course.image }}${{ needs.changes.outputs.image-name-suffix }}
          flavor: |
            latest=false
            suffix=-${{ matrix.gpu_target }}
          tags: |
            type=raw,value=${{ github.event.inputs.version }},enable=${{ github.event.inputs.version != '' }}
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr

      - name: Docker metadata (unsuffixed tags — default target only)
        if: matrix.gpu_target == needs.changes.outputs.course-default-gpu-target
        id: meta-default
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.changes.outputs.registry }}/${{ matrix.course.image }}${{ needs.changes.outputs.image-name-suffix }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.event.inputs.version }},enable=${{ github.event.inputs.version != '' }}
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr

      - name: Merge tags
        id: tags
        env:
          SUFFIXED_TAGS: ${{ steps.meta-suffixed.outputs.tags }}
          DEFAULT_TAGS: ${{ steps.meta-default.outputs.tags }}
        run: |
          {
            echo 'tags<<EOF'
            printf '%s\n' "$SUFFIXED_TAGS" "$DEFAULT_TAGS" | sed '/^$/d' | sort -u
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Resolve course name
        id: course
        env:
          CONTEXT: ${{ matrix.course.context }}
        run: |
          # Course templates install under /opt/workspace/<COURSE_NAME>; the
          # teaching-labs build scripts name the course after its directory.
          dir=${CONTEXT%/}
          echo "name=${dir##*/}" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.course.name }} (${{ matrix.gpu_target }}) image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.course.context }}
          file: ${{ matrix.course.context }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            ${{ steps.meta-suffixed.outputs.labels }}
            org.opencontainers.image.base.name=${{ steps.base.outputs.image }}
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.image }}
            COURSE_NAME=${{ steps.course.outputs.name }}
          cache-from: type=gha,scope=course-${{ matrix.course.image }}-${{ matrix.gpu_target }}
          cache-to: type=gha,mode=max,scope=course-${{ matrix.course.image }}-${{ matrix.gpu_target }}
          provenance: false

  # TODO(RFC 0001): promote the develop-tested digests on main and release tags
  # with `docker buildx imagetools create` (latest / vX.Y.Z, -<gfx> and default
  # unsuffixed aliases) instead of rebuilding. Until then no course images are
  # published from main or tags.
  promote-courses:
    name: Promote Course Images
    needs: changes
    if: |
      needs.changes.outputs.course-list != '[]' &&
      (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
    runs-on: ubuntu-latest
    steps:
      - name: Promotion not implemented
        run: echo "::warning::Course image promotion is not implemented yet; nothing published for ${GITHUB_REF}"
