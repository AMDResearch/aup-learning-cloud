name: Pack Offline Bundle

on:
  # Automatic: fires after all images are built on a release tag push.
  # The job condition below filters to v* tags on the main repo only.
  workflow_run:
    workflows: ["Build Docker Images"]
    types: [completed]

  # Manual: for testing or on-demand bundle creation.
  workflow_dispatch:
    inputs:
      gpu_type:
        description: 'GPU hardware (determines the image profile)'
        required: true
        default: 'strix-halo'
        type: choice
        options:
          - phx          # gfx1103 — Radeon 780M / Phoenix
          - strix        # gfx1150 — Radeon 890M / Strix
          - strix-halo   # gfx1151 — Ryzen AI Max+ 395 / Max 390
          - '9060'       # gfx1200 — Radeon RX 9060
          - 9060xt       # gfx1200 — Radeon RX 9060 XT
          - '9070'       # gfx1201 — Radeon RX 9070
          - 9070xt       # gfx1201 — Radeon RX 9070 XT
          - r9700        # gfx1201 — Radeon AI PRO R9700
      image_tag:
        description: 'Image tag prefix (default: current branch/tag name)'
        required: false
        default: ''
        type: string
      image_registry:
        description: 'Registry prefix for custom images (override for forks or private registries)'
        required: false
        default: 'ghcr.io/amdresearch'
        type: string
permissions:
  contents: write
  packages: read

jobs:
  # ── Automatic release: one job per image profile, triggered by workflow_run ──
  pack-release:
    name: "Pack Bundle (${{ matrix.image_profile }}) — Release"
    if: |
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_profile: gfx1103
            gpu_type: phx
          - image_profile: gfx1150
            gpu_type: strix
          - image_profile: gfx1151
            gpu_type: strix-halo
          - image_profile: gfx1200
            gpu_type: 9060xt
          - image_profile: gfx1201
            gpu_type: 9070xt

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Check available disk space
        run: df -h /

      - name: Checkout code at the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install signed PyYAML package for the installer
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-yaml

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag and registry
        id: tag
        run: |
          RAW="${{ github.event.workflow_run.head_branch }}"
          SANITIZED="${RAW//\//-}"
          echo "value=${SANITIZED}" >> "$GITHUB_OUTPUT"
          echo "Resolved IMAGE_TAG: ${SANITIZED}"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "registry=ghcr.io/${OWNER}" >> "$GITHUB_OUTPUT"

      - name: Check if bundle already exists in release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.value }}"
           PROFILE="${{ matrix.image_profile }}"
           if gh release view "${TAG}" &>/dev/null; then
             # Check if a bundle for this image profile is already attached
             if gh release view "${TAG}" --json assets --jq '.assets[].name' 2>/dev/null \
                 | grep -q "auplc-bundle-${PROFILE}-"; then
               echo "skip=true" >> "$GITHUB_OUTPUT"
               echo "Bundle for ${PROFILE} already exists in release ${TAG}, skipping."
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run pack command
        if: steps.check.outputs.skip != 'true'
        env:
          GPU_TYPE: ${{ matrix.gpu_type }}
          IMAGE_REGISTRY: ${{ steps.tag.outputs.registry }}
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
        run: ./auplc-installer pack

      - name: Verify bundle
        if: steps.check.outputs.skip != 'true'
        run: |
          BUNDLE=$(ls auplc-bundle-*.tar.gz)
          echo "Bundle: ${BUNDLE}"
          echo "Size: $(du -sh "${BUNDLE}" | cut -f1)"

      - name: Upload bundle as artifact
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: auplc-bundle-${{ matrix.image_profile }}
          path: auplc-bundle-*.tar.gz
          retention-days: 30
          compression-level: 0  # already compressed

      - name: Attach bundle to GitHub Release
        if: steps.check.outputs.skip != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUNDLE=$(ls auplc-bundle-*.tar.gz)
          TAG="${{ github.event.workflow_run.head_branch }}"

          # Upload to the release created by the release workflow. If the
          # release is not available yet, keep the bundle artifact for retry.
          if gh release view "${TAG}" &>/dev/null; then
            gh release upload "${TAG}" "${BUNDLE}" --clobber
            echo "Bundle uploaded to release ${TAG}"
          else
            echo "No release found for ${TAG}, skipping upload."
          fi

  # ── Manual: single GPU target via workflow_dispatch ──
  pack-manual:
    name: "Pack Bundle (${{ inputs.gpu_type }})"
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Check available disk space
        run: df -h /

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install signed PyYAML package for the installer
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-yaml

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: tag
        env:
          RAW_IMAGE_TAG: ${{ inputs.image_tag || github.ref_name }}
        run: |
          TAG="${RAW_IMAGE_TAG//\//-}"
          if [[ ! "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "image_tag must be a single-line Docker tag" >&2
            exit 1
          fi
          echo "value=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved IMAGE_TAG: ${TAG}"

      - name: Run pack command
        env:
          GPU_TYPE: ${{ inputs.gpu_type }}
          IMAGE_REGISTRY: ${{ inputs.image_registry }}
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
        run: ./auplc-installer pack

      - name: Verify bundle
        run: |
          BUNDLE=$(ls auplc-bundle-*.tar.gz)
          echo "Bundle: ${BUNDLE}"
          echo "Size: $(du -sh "${BUNDLE}" | cut -f1)"
      - name: Upload bundle as artifact
        uses: actions/upload-artifact@v4
        with:
          name: auplc-bundle-${{ inputs.gpu_type }}
          path: auplc-bundle-*.tar.gz
          retention-days: 7
          compression-level: 0  # already compressed
