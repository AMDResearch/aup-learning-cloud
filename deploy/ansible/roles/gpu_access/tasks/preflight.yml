---
- name: Validate GPU access configuration before target preflight
  ansible.builtin.import_tasks: validate.yml

- name: Inspect GPU access rootfs target
  ansible.builtin.stat:
    path: "{{ _auplc_target_root }}"
    follow: false
  register: _auplc_rootfs
  when: _auplc_target_root | length > 0

- name: Require regular GPU access rootfs directory
  ansible.builtin.assert:
    that:
      - _auplc_rootfs.stat.isdir
      - not _auplc_rootfs.stat.islnk
    fail_msg: GPU access rootfs must be an existing non-symlink directory.
  when: _auplc_target_root | length > 0

- name: Inspect canonical GPU access destination parents
  ansible.builtin.stat:
    path: "{{ _auplc_target_root }}{{ item }}"
    follow: false
  loop:
    - /etc
    - /etc/udev
    - /etc/udev/rules.d
  register: _auplc_destination_parent_stats

- name: Reject unsafe canonical GPU access destination parents
  ansible.builtin.assert:
    that:
      - not item.stat.exists or (item.stat.isdir and not item.stat.islnk)
    fail_msg: "Unsafe canonical GPU access destination parent: {{ item.item }}"
  loop: "{{ _auplc_destination_parent_stats.results }}"

- name: Inspect canonical GPU access destination
  ansible.builtin.stat:
    path: "{{ _auplc_target_root }}/etc/udev/rules.d/70-auplc-gpu-access.rules"
    follow: false
  register: _auplc_destination_rule

- name: Reject unsafe canonical GPU access destination
  ansible.builtin.assert:
    that:
      - not _auplc_destination_rule.stat.exists or
        (_auplc_destination_rule.stat.isreg and not _auplc_destination_rule.stat.islnk)
    fail_msg: Unsafe canonical GPU access destination.

- name: Read existing canonical GPU access rule
  ansible.builtin.slurp:
    src: "{{ _auplc_target_root }}/etc/udev/rules.d/70-auplc-gpu-access.rules"
  register: _auplc_existing_rule
  when: _auplc_destination_rule.stat.exists

- name: Define canonical GPU access rule contents
  ansible.builtin.set_fact:
    _auplc_canonical_rule: |
      # Managed by auplc-installer: AMD GPU device access.
      KERNEL=="kfd", OWNER="root", GROUP="render", MODE="0666"
      SUBSYSTEM=="drm", KERNEL=="renderD*", DRIVERS=="amdgpu", OWNER="root", GROUP="render", MODE="0666"
      SUBSYSTEM=="drm", KERNEL=="card*", DRIVERS=="amdgpu", OWNER="root", GROUP="video", MODE="0666"

- name: Reject unmanaged canonical GPU access rule
  ansible.builtin.assert:
    that: (_auplc_existing_rule.content | b64decode) == _auplc_canonical_rule
    fail_msg: Unmanaged canonical GPU access rule.
  when: _auplc_destination_rule.stat.exists

- name: Define recognized project-owned legacy GPU rules
  ansible.builtin.set_fact:
    _auplc_legacy_gpu_rules:
      - path: "{{ _auplc_target_root }}/etc/udev/rules.d/70-kfd.rules"
        contents:
          - "KERNEL==\"kfd\", MODE=\"0666\"\nSUBSYSTEM==\"drm\", KERNEL==\"renderD*\", MODE=\"0666\"\n"
      - path: "{{ _auplc_target_root }}/etc/udev/rules.d/70-amdgpu.rules"
        contents:
          - |
            # ROCm device permissions
            # Grant render group access to AMD GPU devices
            # Reference: https://rocm.docs.amd.com/projects/install-on-linux/en/latest/install/prerequisites.html#using-udev-rules
            KERNEL=="kfd", GROUP="render", MODE="0660"
            SUBSYSTEM=="drm", KERNEL=="renderD*", GROUP="render", MODE="0660"
          - "KERNEL==\"kfd\", MODE=\"0666\"\nKERNEL==\"renderD[0-9]*\", MODE=\"0666\"\n"
      - path: "{{ _auplc_target_root }}/etc/udev/rules.d/70-rocm-devices.rules"
        contents:
          - |
            # ROCm device permissions
            # Ensure /dev/kfd and /dev/dri/renderD* are accessible by render group
            SUBSYSTEM=="kfd", GROUP="render", MODE="0660"
            SUBSYSTEM=="drm", KERNEL=="renderD*", GROUP="render", MODE="0660"

- name: Inspect recognized project-owned legacy GPU rules
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: false
  loop: "{{ _auplc_legacy_gpu_rules }}"
  register: _auplc_legacy_gpu_rule_stats

- name: Reject legacy GPU rule symlinks and non-regular files
  ansible.builtin.assert:
    that:
      - not item.stat.exists or (item.stat.isreg and not item.stat.islnk)
    fail_msg: "Unexpected legacy GPU rule filesystem type: {{ item.item.path }}"
  loop: "{{ _auplc_legacy_gpu_rule_stats.results }}"

- name: Read recognized project-owned legacy GPU rules
  ansible.builtin.slurp:
    src: "{{ item.item.path }}"
  loop: "{{ _auplc_legacy_gpu_rule_stats.results }}"
  when: item.stat.exists
  register: _auplc_legacy_gpu_rule_contents

- name: Reject unexpected legacy GPU rule content
  ansible.builtin.assert:
    that:
      - (item.content | b64decode) in item.item.item.contents
    fail_msg: "Unexpected legacy GPU rule content: {{ item.item.item.path }}"
  loop: "{{ _auplc_legacy_gpu_rule_contents.results }}"
  when: not item.skipped | default(false)
