---
- name: Install AMD udev package when required
  block:
    - name: Create deterministic AMD udev package cache
      ansible.builtin.file:
        path: "{{ auplc_gpu_udev_package_cache_path | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download checksummed AMD udev package
      ansible.builtin.get_url:
        url: "{{ auplc_gpu_udev_package_url }}"
        dest: "{{ auplc_gpu_udev_package_cache_path }}"
        checksum: "{{ auplc_gpu_udev_package_checksum }}"
        owner: root
        group: root
        mode: "0644"

    - name: Install AMD udev package on live host
      ansible.builtin.apt:
        deb: "{{ auplc_gpu_udev_package_cache_path }}"
        state: present
        allow_downgrade: true
        dpkg_options: force-confnew
      when: _auplc_target_root | length == 0

    - name: Copy AMD udev package into PXE rootfs
      ansible.builtin.copy:
        src: "{{ auplc_gpu_udev_package_cache_path }}"
        dest: "{{ _auplc_target_root }}/tmp/{{ auplc_gpu_udev_package_filename }}"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      when: _auplc_target_root | length > 0

    - name: Install AMD udev package in PXE rootfs
      ansible.builtin.command:
        argv:
          - chroot
          - "{{ _auplc_target_root }}"
          - apt-get
          - --option=Dpkg::Options::=--force-confnew
          - install
          - --yes
          - --no-install-recommends
          - "/tmp/{{ auplc_gpu_udev_package_filename }}"
      environment:
        DEBIAN_FRONTEND: noninteractive
      changed_when: true
      when: _auplc_target_root | length > 0

    - name: Verify installed AMD udev package
      ansible.builtin.import_tasks: verify.yml

  always:
    - name: Remove temporary AMD udev package from PXE rootfs
      ansible.builtin.file:
        path: "{{ _auplc_target_root }}/tmp/{{ auplc_gpu_udev_package_filename }}"
        state: absent
      when: _auplc_target_root | length > 0
  when: _auplc_gpu_udev_install_needed | bool

- name: Verify installed AMD udev package without installation
  ansible.builtin.import_tasks: verify.yml
  when: not _auplc_gpu_udev_install_needed | bool

- name: Recheck recognized project-owned legacy GPU rules before apply
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: false
  loop: "{{ _auplc_legacy_gpu_rules }}"
  register: _auplc_apply_legacy_gpu_rule_stats

- name: Reject unsafe legacy GPU rules before apply
  ansible.builtin.assert:
    that:
      - not item.stat.exists or (item.stat.isreg and not item.stat.islnk)
    fail_msg: "Unexpected legacy GPU rule filesystem type: {{ item.item.path }}"
  loop: "{{ _auplc_apply_legacy_gpu_rule_stats.results }}"

- name: Read recognized project-owned legacy GPU rules before apply
  ansible.builtin.slurp:
    src: "{{ item.item.path }}"
  loop: "{{ _auplc_apply_legacy_gpu_rule_stats.results }}"
  when: item.stat.exists
  register: _auplc_apply_legacy_gpu_rule_contents

- name: Reject unexpected legacy GPU rule content before apply
  ansible.builtin.assert:
    that:
      - >-
        ((item.content | b64decode) | hash('sha256')) in item.item.item.sha256 or
        (item.item.item.path == _auplc_target_root + auplc_gpu_udev_rule_path and
        (item.content | b64decode) == auplc_gpu_udev_rule_content)
    fail_msg: "Unexpected legacy GPU rule content: {{ item.item.item.path }}"
  loop: "{{ _auplc_apply_legacy_gpu_rule_contents.results }}"
  when: not item.skipped | default(false)

- name: Remove recognized project-owned legacy GPU rules
  ansible.builtin.file:
    path: "{{ item.item.item.path }}"
    state: absent
  loop: "{{ _auplc_apply_legacy_gpu_rule_contents.results }}"
  when: >-
    not item.skipped | default(false) and
    ((item.content | b64decode) | hash('sha256')) in item.item.item.sha256
  register: _auplc_removed_legacy_gpu_rules

- name: Reload live udev rules after legacy cleanup
  ansible.builtin.command:
    argv: [udevadm, control, --reload-rules]
  changed_when: false
  when:
    - _auplc_target_root | length == 0
    - _auplc_removed_legacy_gpu_rules.changed

- name: Trigger live udev rules after legacy cleanup
  ansible.builtin.command:
    argv: [udevadm, trigger]
  changed_when: false
  when:
    - _auplc_target_root | length == 0
    - _auplc_removed_legacy_gpu_rules.changed
