---
# ROCm user-space is supplied by workload images. Client hosts use the
# Ubuntu kernel's amdgpu module; they do not need the AMD installer or DKMS.
- name: Validate the client GPU stack before installing prerequisites
  ansible.builtin.import_tasks: preflight.yml

- name: Ensure Ubuntu firmware is installed
  ansible.builtin.apt:
    name: linux-firmware
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: _auplc_ubuntu_firmware

- name: Report firmware activation requirements
  ansible.builtin.debug:
    msg: >-
      Ubuntu firmware packages changed. Reboot this node in a maintenance
      window before accepting GPU workloads, then rerun pb-rocm.yml and
      validate ROCm compute inside the workload container.
  when: _auplc_ubuntu_firmware.changed
